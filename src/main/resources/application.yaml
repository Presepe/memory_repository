spring:
  application:
    name: reservation-manager-rest-api
  # Configurazione Database H2
  datasource:
    url: jdbc:h2:mem:reservationdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  # Configurazione console web di H2
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  # Configurazione JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update' aggiorna lo schema se cambi il model.
      # Usa 'create-drop' se vuoi che il DB si svuoti ad ogni riavvio.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configurazione Swagger UI (Springdoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Ordina gli endpoint alfabeticamente per metodo HTTP
    operationsSorter: method
    # Espande i tag di default
    doc-expansion: list